version: '3'

tasks:
  check:
    desc: Check Kotlin files
    cmds:
      - bash gradlew check
      # commons-convention is pulled in via `pluginManagement { includeBuild(...) }`, which wires
      # it onto the root build's plugin classpath but not onto its `check` task graph, so its own
      # check has to be invoked separately (mirroring the `publish` task's per-module dispatch).
      - bash gradlew -p commons-convention check

  fix:
    desc: Fix Kotlin files
    cmds:
      - bash gradlew ktfmtFormat

  build:
    desc: Assemble Gradle project
    cmds:
      - bash gradlew build

  publish:
    desc: Publish a Maven artifact
    cmds:
      - bash gradlew {{.GRADLE_TARGET}}
    vars:
      GRADLE_TARGET:
        sh: |
          case "{{.MODULE}}" in
            commons-convention) echo "-p commons-convention publish" ;;
            *) echo ":{{.MODULE}}:publish" ;;
          esac
