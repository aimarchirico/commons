commons:
  active: true
  NonDocComment:
    active: true
    excludes: ['**/*.gradle.kts']

comments:
  active: true
  # Kotlin nested/inner declarations are public by default, same as top-level
  # ones, so they are part of the public API surface and need documentation
  # too.
  UndocumentedPublicClass:
    active: true
    searchInNestedClass: true
    searchInInnerClass: true
    searchInInnerObject: true
    searchInInnerInterface: true
  UndocumentedPublicFunction:
    active: true
  UndocumentedPublicProperty:
    active: true
  OutdatedDocumentation:
    active: true
