commons:
  active: true
  PublicKDocOnly:
    active: true
  SuppressRequiresReason:
    active: true
  FileLength:
    active: true
    maxLines: 300
  FileNaming:
    active: true
    excludes: ['**/*.gradle.kts']

comments:
  active: true
  UndocumentedPublicClass:
    active: true
    searchInNestedClass: true
    searchInInnerClass: true
    searchInInnerObject: true
    searchInInnerInterface: true
    excludes: ['**/test/**', '**/build.gradle.kts']
  UndocumentedPublicFunction:
    active: true
    excludes: ['**/test/**', '**/build.gradle.kts']
  UndocumentedPublicProperty:
    active: true
    excludes: ['**/test/**', '**/build.gradle.kts']
  OutdatedDocumentation:
    active: true
