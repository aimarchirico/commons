[project]
name = "commons-python"
version = "1.0.0"
description = "Shared ruff configuration and Python conventions."
requires-python = ">=3.13"
dependencies = ["ruff>=0.14", "ty>=0.0.60", "coverage>=7.6"]

[project.scripts]
commons-python = "commons_python.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commons_python"]
