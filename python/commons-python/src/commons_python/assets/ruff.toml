target-version = "py313"

[lint]
select = ["ALL"]
ignore = [
  # CPY001: Copyright header notices are not enforced across this repository.
  "CPY001",
]

[lint.per-file-ignores]
"*tests*" = [
  # S101: Tests use assert statements, which are the standard idiom for pytest test assertions.
  "S101",
  # INP001: Test directories intentionally skip __init__.py so each skill's scripts/tests
  # package doesn't collide with another skill's under the same name; conftest.py adds the
  # sibling scripts/ directory to sys.path instead.
  "INP001",
  # SLF001: Tests reach into a script's private helpers directly since these scripts have no
  # public API beyond their CLI entry point.
  "SLF001",
]
"**/conftest.py" = [
  # INP001: See the *tests* entry above; conftest.py lives beside it for the same reason.
  "INP001",
]

# Scoped ignores for CLI entry points and CLI utility scripts.
"*cli*.py" = [
  # S603: subprocess.run calls are used for executing wrapped tools.
  "S603",
]
"*skills*" = [
  # S603: subprocess.run calls are used in skill scripts to run shell commands.
  "S603",
  # EXE001: Executable file permissions vary across operating systems.
  "EXE001",
]
[lint.pydocstyle]
convention = "google"
