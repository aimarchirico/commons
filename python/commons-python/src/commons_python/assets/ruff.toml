target-version = "py313"

[lint]
select = ["ALL"]
ignore = [
  # CPY001: Copyright header notices are not enforced across this repository.
  "CPY001",
]

[lint.per-file-ignores]
# Tests use assert statements, which are the standard idiom for pytest test assertions.
# INP001: test directories intentionally skip __init__.py so each skill's
# scripts/tests package doesn't collide with another skill's under the same name;
# conftest.py adds the sibling scripts/ directory to sys.path instead.
# SLF001: tests reach into a script's private helpers directly since these
# scripts have no public API beyond their CLI entry point.
"*tests*" = [
  "S101",
  "INP001",
  "SLF001",
]
"**/conftest.py" = [
  "INP001",
]

# Scoped ignores for CLI entry points and CLI utility scripts.
"*cli*.py" = [
  # S603: subprocess.run calls are used for executing wrapped tools.
  "S603",
]
"*skills*" = [
  # S603: subprocess.run calls are used in skill scripts to run shell commands.
  "S603",
  # EXE001: Executable file permissions vary across operating systems.
  "EXE001",
]

[lint.pydocstyle]
convention = "google"
