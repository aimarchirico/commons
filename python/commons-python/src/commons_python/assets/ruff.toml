target-version = "py313"

[lint]
select = ["ALL"]
ignore = [
  # CPY001: Copyright header notices are not enforced across this repository.
  "CPY001",
  # S603: subprocess.run calls without shell=True are standard and safe.
  "S603",
]

[lint.per-file-ignores]
"*tests*" = [
  # S101: Tests use assert statements, which are the standard idiom for pytest test assertions.
  "S101",
  # INP001: Test directories intentionally skip __init__.py so each skill's scripts/tests
  # package doesn't collide with another skill's under the same name.
  "INP001",
]

[lint.pydocstyle]
convention = "google"

