name: Self-Review Signal

on:
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write

jobs:
  signal:
    name: Self-Review Signal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: ./.github/actions/self-review-signal
