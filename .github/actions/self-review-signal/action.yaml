name: Self-Review Signal
description: Submit a real review verdict when a submitted review's body signals one, since PR authors can't review their own PR.
inputs:
  token:
    description: Token used to submit the review
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Self-Review Signal
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token }}
        script: |
          const body = context.payload.review.body || "";
          let event;
          if (body.startsWith("Approved.")) {
            event = "APPROVE";
          } else if (body.startsWith("Requesting changes.")) {
            event = "REQUEST_CHANGES";
          } else {
            core.info("Review body carries no recognized verdict — skipping.");
            return;
          }
          await github.rest.pulls.createReview({
            ...context.repo,
            pull_number: context.payload.pull_request.number,
            event,
          });
          core.info(`Submitted ${event} on PR #${context.payload.pull_request.number}`);
