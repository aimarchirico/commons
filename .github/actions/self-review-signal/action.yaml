name: Self-Review Signal
description: Submit a real review verdict when a submitted review's body signals one, since PR authors can't review their own PR.
inputs:
  token:
    description: Token used to submit the review
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Self-Review Signal
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token }}
        script: |
          const reviewer = context.payload.review?.user?.login;
          const author = context.payload.pull_request?.user?.login;
          if (reviewer !== author) {
            core.info(`Reviewer (${reviewer}) is not the PR author (${author}), skipping self-review signal.`);
            return;
          }

          const body = context.payload.review.body || "";
          const line = body
            .split("\n")
            .map((l) => l.trim())
            .find((l) => l !== "" && !l.startsWith("#")) || "";
          let event;
          if (line.startsWith("Approved.")) {
            event = "APPROVE";
          } else if (line.startsWith("Changes requested.")) {
            event = "REQUEST_CHANGES";
          } else {
            core.info("Review body carries no recognized verdict, skipping.");
            return;
          }
          await github.rest.pulls.createReview({
            ...context.repo,
            pull_number: context.payload.pull_request.number,
            event,
            body: `🤖 **Self-Review Signal**: Automated ${event === "APPROVE" ? "approval" : "changes requested"} submitted on behalf of the PR author.`,
          });
          core.info(`Submitted ${event} on PR #${context.payload.pull_request.number}`);
