name: Self Approve PR
description: Approve the current pull request when a submitted review's verdict is "Approved."
inputs:
  token:
    description: Token used to approve the pull request
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Self Approve PR
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token }}
        script: |
          const body = context.payload.review.body || "";
          if (!body.startsWith("Approved.")) {
            core.info("Review body does not start with 'Approved.' — skipping.");
            return;
          }
          await github.rest.pulls.createReview({
            ...context.repo,
            pull_number: context.payload.pull_request.number,
            event: "APPROVE",
          });
          core.info(`Approved PR #${context.payload.pull_request.number}`);
