name: Assign Sub-Issues
description: Cascade newly-added assignees to every nested sub-issue
inputs:
  token:
    description: Token used to read and assign sub-issues
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Assign Sub-Issues
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token }}
        script: |
          // BFS to assign the new assignee to all nested sub-issues
          const assignee = context.payload.assignee.login;
          const queue = [context.payload.issue.number];
          while (queue.length) {
            const issue_number = queue.shift();
            const subIssues = await github.paginate(
              "GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues",
              { ...context.repo, issue_number, per_page: 100 }
            );
            for (const sub of subIssues) {
              await github.rest.issues.addAssignees({
                ...context.repo,
                issue_number: sub.number,
                assignees: [assignee],
              });
              core.info(`Assigned ${assignee} to sub-issue #${sub.number}`);
              queue.push(sub.number);
            }
          }
